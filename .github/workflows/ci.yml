name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Matches the version used locally. There is no engines field or .nvmrc
      # yet, so this pin is the only thing keeping CI and local in step.
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run build
